name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/tmp/sshkey
          chmod 600 ~/tmp/sshkey

      - name: Deploy on EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
            set -e

            cd aws-test

            git pull origin dev

            npm install

            pm2 restart all || pm2 start npm --name "express" -- start

            pm2 save
          EOF
